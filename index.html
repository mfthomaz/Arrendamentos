<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f0">
    <meta name="description" content="Gestão simples e clara dos seus imóveis arrendados.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/casathomaz.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/casathomaz-192.svg">
    <title>CasaThomaz — Gestão de arrendamentos</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar para o conteúdo</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#inicio" aria-label="CasaThomaz, início" data-view="dashboard">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M4.5 15.1 16 5.5l11.5 9.6v12.1h-8v-8h-7v8h-8V15.1Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M23 8.5V5.8h3.5v5.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="brand-name">Casa<span>Thomaz</span></span>
        </a>
        <div class="topbar-right">
          <span class="today-label" id="today-label"></span>
          <span class="topbar-divider" aria-hidden="true"></span>
          <div class="account-actions" id="account-actions"></div>
          <span class="user-chip" id="local-profile" aria-label="Perfil do proprietário">
            <span class="avatar" aria-hidden="true">CT</span>
            <span class="user-name">Proprietário</span>
          </span>
        </div>
      </header>

      <aside class="sidebar" aria-label="Navegação principal">
        <p class="nav-caption">GESTÃO</p>
        <nav class="side-nav">
          <button type="button" class="nav-item is-active" data-view="dashboard" aria-current="page">
            <span class="nav-icon" aria-hidden="true">⌂</span><span>Visão geral</span>
          </button>
          <button type="button" class="nav-item" data-view="properties">
            <span class="nav-icon" aria-hidden="true">▦</span><span>Imóveis</span>
          </button>
          <button type="button" class="nav-item" data-view="contracts">
            <span class="nav-icon" aria-hidden="true">▤</span><span>Contratos</span>
          </button>
          <button type="button" class="nav-item" data-view="payments">
            <span class="nav-icon" aria-hidden="true">€</span><span>Rendas e pagamentos</span>
          </button>
          <button type="button" class="nav-item" data-view="agenda">
            <span class="nav-icon" aria-hidden="true">▣</span><span>Agenda e avisos</span>
            <span class="nav-count" id="agenda-count" hidden></span>
          </button>
        </nav>
        <div class="sidebar-note">
          <span class="note-icon" aria-hidden="true">✦</span>
          <p>Uma casa bem gerida começa com tudo no seu lugar.</p>
        </div>
        <div class="sidebar-foot">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="sync-label">Só neste dispositivo</span>
        </div>
      </aside>

      <main id="main-content" class="main-content" tabindex="-1">
        <div id="app-content" aria-live="polite"></div>
      </main>
    </div>
    <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
